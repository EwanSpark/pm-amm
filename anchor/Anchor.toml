[toolchain]
anchor_version = "1.0.1"
solana_version = "3.0.14"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
pm_amm = "GV1FMGHRYBjQLaghE5fnGuYCuCcpdt3GD5xEX3TwN16y"

[programs.localnet]
pm_amm = "GV1FMGHRYBjQLaghE5fnGuYCuCcpdt3GD5xEX3TwN16y"

# Same program ID as devnet — declare_id! is compiled in and clusters are
# isolated. Deploy with anchor/scripts/deploy-mainnet.sh (real SOL).
[programs.mainnet]
pm_amm = "GV1FMGHRYBjQLaghE5fnGuYCuCcpdt3GD5xEX3TwN16y"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Unit-ish suites first, then the long real-time lifecycle suites (they wait
# for the validator clock and would otherwise skew the others' wall-clock math).
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 3000000 tests/*.ts tests/lifecycle/*.ts"

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://api.devnet.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
